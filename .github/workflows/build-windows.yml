
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name RanobeLib-Downloader --collect-all PyQt6 --collect-all PyQt6-WebEngine gui.py

      - name: Pack application
        run: |
          Compress-Archive -Path dist/RanobeLib-Downloader -DestinationPath RanobeLib-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RanobeLib-Windows
          path: RanobeLib-Windows.zip
